<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120">
  <!-- Hexagon left half (dark blue) -->
  <polygon points="58,8 15,33 15,87 58,112" fill="#0e7490"/>
  <!-- Hexagon right half (light blue / cyan) -->
  <polygon points="58,8 101,33 101,87 58,112" fill="#06b6d4"/>

  <!-- S letter (white) centered in hexagon -->
  <text x="58" y="80"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800" font-size="58"
    fill="white" text-anchor="middle">S</text>

  <!-- Checkmark accent (dark cyan) -->
  <polyline points="43,90 49,99 72,79"
    fill="none" stroke="#0e7490" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Scor" text dark slate -->
  <text x="118" y="82"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800" font-size="60"
    fill="#0f172a">Scor<tspan fill="#06b6d4">avo</tspan></text>
</svg>
